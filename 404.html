    <!-- GitHub Pages serves this page at any missing URL, so relative paths
         need a base. Project sites live under /<repo>/, Netlify at the root. -->
    <script>
        (function () {
            var firstSegment = window.location.pathname.split("/")[1];
            var base = document.createElement("base");
            base.href = window.location.hostname.endsWith(".github.io") && firstSegment ? "/" + firstSegment + "/" : "/";
            document.head.appendChild(base);
        })();
    </script>
